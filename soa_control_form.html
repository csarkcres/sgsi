{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">DECLARACIÓN DE APLICABILIDAD</p><h1>{{ control.code }} · {{ control.title }}</h1><p class="muted">{{ control.category }}</p></div><a class="btn secondary" href="{{ url_for('soa') }}">Volver a SoA</a></div><form method="post" class="panel form-grid"><label>Aplicabilidad<select name="applicable"><option value="" {% if control.applicable is none %}selected{% endif %}>Pendiente de evaluación</option><option value="1" {% if control.applicable==1 %}selected{% endif %}>Aplicable</option><option value="0" {% if control.applicable==0 %}selected{% endif %}>No aplicable</option></select></label><label>Responsable del control<input name="owner" value="{{ control.owner }}" placeholder="Cargo o unidad responsable"></label><label class="full">Justificación de aplicabilidad / exclusión<textarea name="applicability_justification" rows="3" placeholder="Obligatoria si se declara no aplicable">{{ control.applicability_justification }}</textarea></label><label>Estado de implementación<select name="implementation_status">{% for st in ['No iniciado','En curso','Parcialmente implementado','Implementado'] %}<option {% if control.implementation_status==st %}selected{% endif %}>{{ st }}</option>{% endfor %}</select></label><label>Última revisión<input value="{{ control.reviewed_at or 'Sin revisar' }}" disabled></label><label class="full">Notas de implementación<textarea name="implementation_notes" rows="3">{{ control.implementation_notes }}</textarea></label><label class="full">Evidencia / referencia documental<input name="evidence" value="{{ control.evidence }}" placeholder="Procedimiento, ticket, acta, ruta documental, etc."></label><div class="form-actions full"><button class="btn primary" type="submit">Guardar control</button><a class="btn secondary" href="{{ url_for('soa') }}">Cancelar</a></div></form>{% endblock %}
