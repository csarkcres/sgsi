{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><form method="post" class="panel auth-card"><p class="eyebrow">PRIMER INICIO</p><h1>Crear administrador</h1><p class="muted">Esta pantalla solo está disponible antes de crear el primer usuario. Define una contraseña única de al menos 12 caracteres.</p><label>Usuario administrador<input name="username" autocomplete="username" required value="cesar.caceres"></label><label>Nombre visible<input name="display_name" required value="Administrador SGSI"></label><label>Contraseña nueva<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><label>Confirmar contraseña<input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label><button class="btn primary" type="submit">Crear cuenta y entrar</button></form></div>{% endblock %}
