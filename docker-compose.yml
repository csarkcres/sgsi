services:
  sgsi-riesgos:
    build: .
    container_name: sgsi-riesgos
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DB_PATH: /data/sgsi.db
      SECRET_KEY: ${SECRET_KEY:?Define una clave aleatoria en el archivo .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - sgsi_data:/data
volumes:
  sgsi_data:
