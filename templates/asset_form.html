{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">INVENTARIO</p><h1>{{ title }}</h1><p class="muted">La criticidad y la clasificación CID son escalas de 1 a 5.</p></div><a class="btn secondary" href="{{ url_for('assets') }}">Volver</a></div><form method="post" class="panel form-grid"><label>Código<input name="code" value="{{ asset.code if asset else '' }}" placeholder="ACT-001"></label><label>Nombre del activo *<input required name="name" value="{{ asset.name if asset else '' }}"></label><label>Tipo<select name="asset_type">{% for t in asset_types %}<option {% if asset and asset.asset_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></label><label>Subtipo<input name="subtype" value="{{ asset.subtype if asset else '' }}" placeholder="Web, base de datos, SLA..."></label><label>Responsable<input name="owner" value="{{ asset.owner if asset else '' }}"></label><label>Estado<select name="status"><option {% if not asset or asset.status=='Activo' %}selected{% endif %}>Activo</option><option {% if asset and asset.status=='Inactivo' %}selected{% endif %}>Inactivo</option></select></label><label>Confidencialidad (1–5)<input type="number" min="1" max="5" name="confidentiality" value="{{ asset.confidentiality if asset else 3 }}"></label><label>Integridad (1–5)<input type="number" min="1" max="5" name="integrity" value="{{ asset.integrity if asset else 3 }}"></label><label>Disponibilidad (1–5)<input type="number" min="1" max="5" name="availability" value="{{ asset.availability if asset else 3 }}"></label><label>Criticidad (1–5)<input type="number" min="1" max="5" name="criticality" value="{{ asset.criticality if asset else 3 }}"></label><label class="full">Descripción<textarea name="description" rows="3">{{ asset.description if asset else '' }}</textarea></label><div class="form-actions full"><button class="btn primary" type="submit">Guardar activo</button><a class="btn secondary" href="{{ url_for('assets') }}">Cancelar</a></div></form>{% endblock %}
