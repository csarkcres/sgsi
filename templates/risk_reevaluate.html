{% extends 'base.html' %}{% block content %}<div class="page-head"><div><h1>Reevaluar riesgo residual</h1><p>{{ risk.code }} · {{ risk.name }}</p></div><a class="btn secondary" href="{{ url_for('risk_detail',risk_id=risk.id) }}">Volver</a></div><section class="panel"><p>Evaluación vigente: {{ risk.residual_probability }} × {{ risk.residual_impact }} = {{ risk.residual_score }} · {{ risk.residual_level }}</p><form method="post" class="form-grid"><label>Probabilidad residual<select name="residual_probability" required>{% for value,label in probability.items() %}<option value="{{ value }}" {% if value==risk.residual_probability %}selected{% endif %}>{{ value }} — {{ label }}</option>{% endfor %}</select></label><label>Impacto residual<select name="residual_impact" required>{% for value,label in impact_labels.items() %}<option value="{{ value }}" {% if value==risk.residual_impact %}selected{% endif %}>{{ value }} — {{ label }}</option>{% endfor %}</select></label><label class="full">Justificación obligatoria<textarea name="justification" rows="5" required placeholder="Evidencias revisadas, controles implementados y fundamento de la nueva valoración."></textarea></label><div class="form-actions full"><button class="btn primary" type="submit">Registrar reevaluación</button><a class="btn secondary" href="{{ url_for('risk_detail',risk_id=risk.id) }}">Cancelar</a></div></form></section>{% endblock %}
